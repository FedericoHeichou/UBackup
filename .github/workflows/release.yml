name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build Linux AppImage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            patchelf \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          umask 0002
          python -m pytest -q

      - name: Build single-file AppImage
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          chmod +x scripts/build_portable.sh
          UBACKUP_APPIMAGE_OUTPUT="$PWD/UBackup-${RELEASE_TAG}-x86_64.AppImage" \
            ./scripts/build_portable.sh
          test -x "UBackup-${RELEASE_TAG}-x86_64.AppImage"

      - name: Package root helper installer
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p root-helper/scripts
          mkdir -p root-helper/src/ubackup/privileged
          mkdir -p root-helper/packaging/libexec
          mkdir -p root-helper/packaging/polkit

          cp scripts/install_system.sh root-helper/scripts/

          cp src/ubackup/__init__.py root-helper/src/ubackup/
          cp src/ubackup/cache.py root-helper/src/ubackup/
          cp src/ubackup/fs_scan.py root-helper/src/ubackup/
          cp src/ubackup/manifest.py root-helper/src/ubackup/
          cp src/ubackup/models.py root-helper/src/ubackup/
          cp src/ubackup/paths.py root-helper/src/ubackup/
          cp src/ubackup/profiles.py root-helper/src/ubackup/
          cp src/ubackup/restic_engine.py root-helper/src/ubackup/
          cp src/ubackup/restore_engine.py root-helper/src/ubackup/
          cp src/ubackup/system_scan.py root-helper/src/ubackup/

          cp src/ubackup/privileged/__init__.py root-helper/src/ubackup/privileged/
          cp src/ubackup/privileged/backup.py root-helper/src/ubackup/privileged/
          cp src/ubackup/privileged/configure.py root-helper/src/ubackup/privileged/
          cp src/ubackup/privileged/credentials.py root-helper/src/ubackup/privileged/
          cp src/ubackup/privileged/filesystem_navigation.py root-helper/src/ubackup/privileged/
          cp src/ubackup/privileged/inspect.py root-helper/src/ubackup/privileged/
          cp src/ubackup/privileged/maintenance.py root-helper/src/ubackup/privileged/
          cp src/ubackup/privileged/metadata.py root-helper/src/ubackup/privileged/
          cp src/ubackup/privileged/packages_install.py root-helper/src/ubackup/privileged/
          cp src/ubackup/privileged/protocol.py root-helper/src/ubackup/privileged/
          cp src/ubackup/privileged/restore.py root-helper/src/ubackup/privileged/
          cp src/ubackup/privileged/restore_inplace.py root-helper/src/ubackup/privileged/
          cp src/ubackup/privileged/restore_staging.py root-helper/src/ubackup/privileged/
          cp src/ubackup/privileged/runtime.py root-helper/src/ubackup/privileged/
          cp src/ubackup/privileged/startup.py root-helper/src/ubackup/privileged/
          cp src/ubackup/privileged/validation.py root-helper/src/ubackup/privileged/

          cp packaging/libexec/ubackup-configure root-helper/packaging/libexec/
          cp packaging/libexec/ubackup-startup root-helper/packaging/libexec/
          cp packaging/libexec/ubackup-inspect root-helper/packaging/libexec/
          cp packaging/libexec/ubackup-backup root-helper/packaging/libexec/
          cp packaging/libexec/ubackup-restore-staging root-helper/packaging/libexec/
          cp packaging/libexec/ubackup-restore-inplace root-helper/packaging/libexec/
          cp packaging/libexec/ubackup-packages-install root-helper/packaging/libexec/

          cp packaging/polkit/org.ubackup.configure.policy root-helper/packaging/polkit/
          cp packaging/polkit/org.ubackup.startup.policy root-helper/packaging/polkit/
          cp packaging/polkit/org.ubackup.inspect.policy root-helper/packaging/polkit/
          cp packaging/polkit/org.ubackup.backup.policy root-helper/packaging/polkit/
          cp packaging/polkit/org.ubackup.restore-staging.policy root-helper/packaging/polkit/
          cp packaging/polkit/org.ubackup.restore-inplace.policy root-helper/packaging/polkit/
          cp packaging/polkit/org.ubackup.packages-install.policy root-helper/packaging/polkit/

          tar -C root-helper \
            -czf "UBackup-${RELEASE_TAG}-root-helper.tar.gz" .

      - name: Create GitHub release if needed
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi

      - name: Upload release files
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "UBackup-${RELEASE_TAG}-x86_64.AppImage" \
            "UBackup-${RELEASE_TAG}-root-helper.tar.gz" \
            --clobber
