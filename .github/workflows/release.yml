name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build Linux portable
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            patchelf

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          umask 0002
          python -m pytest -q

      - name: Build portable application
        run: |
          chmod +x scripts/build_portable.sh
          ./scripts/build_portable.sh

      - name: Package portable build
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          tar -C dist -czf "UBackup-${RELEASE_TAG}-linux-x86_64.tar.gz" .

      - name: Create GitHub release if needed
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi

      - name: Upload portable build to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "UBackup-${RELEASE_TAG}-linux-x86_64.tar.gz" \
            --clobber
